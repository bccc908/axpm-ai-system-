<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111521">
<title>Offline · Kayden Chiew</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #111521; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 20px 0 8px; color: #fff; }
  p { font-size: 15px; line-height: 1.5; margin: 0 0 6px; color: #9ca3af; }
  .zh { margin-top: 18px; }
  button { margin-top: 24px; padding: 12px 22px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Kayden Chiew">
  <h1>You're offline</h1>
  <p>Kayden Chiew needs a connection to show your account. Check your internet and try again.</p>
  <div class="zh" lang="zh-CN">
    <h1>当前没有网络</h1>
    <p>Kayden Chiew 需要联网才能显示你的账户。请检查网络后重试。</p>
  </div>
  <button type="button" onclick="location.reload()">Try again · 重试</button>
</main>
</body>
</html>
